version: 2

builds:
  - main: .
    binary: jbuntai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/chez-shanpu/jbuntai/cmd.version={{.Version}}
      - -X github.com/chez-shanpu/jbuntai/cmd.commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
